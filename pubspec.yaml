    # node tree + CA bundle, python stdlib + pip, git templates,
    # git-core multicall names, and the asset manifest the backend
    # uses to extract them on first launch.
    # GENERATED by script/android/stage-tier2.sh -- do not edit by hand.
    # Flutter pubspec directory entries are NOT recursive (flutter_tools
    # asset.dart _parseAssetsFromFolder uses a non-recursive listSync),
    # so every subdirectory of the node/python/git-templates trees must
    # be listed explicitly. Re-run the staging script to regenerate.
